spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            # Auth Service Routes
            - id: auth-service-register
              uri: http://auth-service:8080
              predicates:
                - Path=/api/v1/auth/register
                - Method=POST
              filters:
                - RewritePath=/api/v1/auth/(?<segment>.*), /api/v1/auth/$\{segment}

            - id: auth-service-login
              uri: http://auth-service:8080
              predicates:
                - Path=/api/v1/auth/login
                - Method=POST
              filters:
                - RewritePath=/api/v1/auth/(?<segment>.*), /api/v1/auth/$\{segment}

            - id: auth-service
              uri: http://auth-service:8080
              predicates:
                - Path=/api/v1/auth/**
              filters:
                - RewritePath=/api/v1/auth/(?<segment>.*), /api/v1/auth/$\{segment}

            # User Service Routes
            - id: user-service
              uri: http://user-service:8080
              predicates:
                - Path=/api/v1/users/**,/api/v1/cards/**

            # Order Service Routes
            - id: order-service
              uri: http://order-service:8080
              predicates:
                - Path=/api/v1/orders/**,/api/v1/items/**

            # Payment Service Routes
            - id: payment-service
              uri: http://payment-service:8080
              predicates:
                - Path=/api/v1/payments/**

          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin

          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origins: "*"
                allowed-methods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowed-headers: "*"
                exposed-headers:
                  - Authorization

jwt:
  secret: ${JWT_SECRET:your-secret-key}

services:
  auth:
    url: http://auth-service:8080
  user:
    url: http://user-service:8080
  service-key: ${SERVICE_API_KEY:service-key}

server:
  port: 8080

logging:
  pattern:
    correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-}] "
  level:
    root: INFO
    com.innowise.apigateway: INFO
    feign: WARN
    io.opentelemetry: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,gateway
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
    prometheus:
      access: unrestricted
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true
      slo:
        "[http.server.requests]": 50ms,100ms,200ms,500ms,1s
  tracing:
    enabled: true
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://otel-collector.monitoring.svc.cluster.local:4318}/v1/traces
    metrics:
      export:
        url: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://otel-collector.monitoring.svc.cluster.local:4318}/v1/traces